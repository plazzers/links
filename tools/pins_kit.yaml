# Faceless Creator Kit — Pinterest pins.
#
# 30 pins that promote the Faceless Creator Kit (Channel Planner + Pin Factory),
# its free tools and the guides in content/kit/. New pins go at the END so
# numbered file names don't shift; keep every slug unique (lowercase-with-dashes).
#
# slug:        unique id, lowercase-with-dashes
# type:        tip | howto | feature | tool
#              tip/howto pins link to the matching guide, feature pins link to
#              the kit, tool pins link to a free tool
# topic:       pinterest | youtube | workflow (the scheduler keeps the same topic
#              from running back to back)
# kicker:      small line above the headline (<= 24 chars)
# headline:    big text, 22–48 chars; wrap the 1–3 words to highlight in *stars*
# body:        tip/feature/tool only: 1–2 plain sentences, 60–130 chars
# items:       howto only: 3–5 short lines (<= 26 chars each), no body
# tag:         the pill bottom-left (<= 18 chars)
# title / description / keywords: what Pinterest shows (title 40–100 chars,
#              description 150–450 chars ending in a soft call to action,
#              5–8 keywords)
# link:        creator-kit | title-scorer | pinterest-csv-checker | guide/<slug>
# board:       Pinterest Marketing for Creators (pinterest tips/howtos),
#              Faceless YouTube Tips (youtube/workflow tips/howtos),
#              YouTube Growth Tools (feature and tool pins)
#
# Honesty: no stats, no promises of views, income or sales, no ratings or
# testimonials. Facts must match the guides in content/kit/.

pins:

# ---------------------------------------------------------------- tips (10)

  - slug: exact-pinterest-csv-header
    type: tip
    topic: pinterest
    kicker: "Pinterest tip"
    headline: "The *exact CSV header* Pinterest wants"
    body: "Title, Media URL, Pinterest board, Thumbnail, Description, Link, Publish date, Keywords. Same spelling, same order."
    tag: "Free guide"
    title: "The Exact Pinterest Bulk Upload CSV Header (Copy and Paste)"
    description: "Pinterest bulk create is strict about the first line of your CSV. It needs eight columns, spelled exactly right and in order: Title, Media URL, Pinterest board, Thumbnail, Description, Link, Publish date, Keywords. Keep the Thumbnail column even for image pins, or everything after it shifts. The free guide walks through a sample row and the full upload."
    keywords: [pinterest bulk upload, pinterest csv, bulk create pins, pinterest marketing, csv header, pinterest for creators]
    link: guide/pinterest-bulk-upload-csv
    board: "Pinterest Marketing for Creators"

  - slug: pinterest-publish-date-format
    type: tip
    topic: pinterest
    kicker: "Pinterest CSV tip"
    headline: "Publish dates need *a capital T*"
    body: "Use YYYY-MM-DDTHH:MM:SS, like 2026-10-20T18:00:00, and make sure every date is still in the future."
    tag: "Save for later"
    title: "Pinterest CSV Publish Date Format: Fix Pins That Post Right Away"
    description: "If your bulk-uploaded pins publish immediately or the row fails, check the Publish date column. Pinterest expects YYYY-MM-DDTHH:MM:SS with a capital T, and every date must be in the future when you upload. Spreadsheets like to reformat dates, so set the column to plain text. The free guide covers this and the other common CSV errors."
    keywords: [pinterest csv error, pinterest publish date, schedule pinterest pins, pinterest bulk upload, pinterest tips]
    link: guide/pinterest-bulk-csv-errors
    board: "Pinterest Marketing for Creators"

  - slug: drive-links-fail-on-pinterest
    type: tip
    topic: pinterest
    kicker: "Pinterest tip"
    headline: "Why *Google Drive links* fail on Pinterest"
    body: "Share links open a preview page, not the image. Bulk upload needs a public, direct link ending in .jpg or .png."
    tag: "Free guide"
    title: "Why Google Drive Links Fail in Pinterest Bulk Upload (and a Free Fix)"
    description: "Pinterest bulk upload fetches every image from the Media URL in your CSV. Google Drive and Dropbox share links usually open a viewer page instead of the raw file, so the fetch fails. GitHub Pages gives each image a plain public address for free, and you can set it up from the github.com website. The step-by-step guide shows how."
    keywords: [pinterest bulk upload, host images for pinterest, github pages, pinterest media url, pinterest csv, free image hosting]
    link: guide/host-pinterest-images-github-pages
    board: "Pinterest Marketing for Creators"

  - slug: dont-reuse-thumbnail-as-pin
    type: tip
    topic: pinterest
    kicker: "Pinterest for YouTubers"
    headline: "Don't reuse your *YouTube thumbnail* as a pin"
    body: "A 1280×720 thumbnail is the wrong shape and gets small in the feed. Make a 1000×1500 pin with a short headline."
    tag: "Save for later"
    title: "Pinterest for YouTubers: Why Your Thumbnail Makes a Weak Pin"
    description: "Pinterest's feed is built around tall 2:3 pins. A wide 1280×720 YouTube thumbnail shrinks in it and the text gets hard to read on a phone. Make a 1000×1500 pin instead, with a short readable headline and consistent colors, and link it straight to the video. The free guide covers what to pin for each video and where to link."
    keywords: [pinterest for youtubers, pinterest pin size, youtube promotion, pinterest marketing, faceless youtube, pinterest pin design]
    link: guide/pinterest-for-youtubers
    board: "Pinterest Marketing for Creators"

  - slug: thumbnail-text-two-to-five-words
    type: tip
    topic: youtube
    kicker: "Thumbnail tip"
    headline: "Keep thumbnail text to *2-5 words*"
    body: "Viewers scrolling won't read a sentence. Use a few bold words that add to the title instead of repeating it."
    tag: "Free guide"
    title: "YouTube Thumbnail Text Rules: Keep It to 2 to 5 Readable Words"
    description: "Thumbnails are seen small and fast, so a sentence won't get read. Keep thumbnail text to two to five words, split it into two short lines, use strong contrast and a bold font, and keep it clear of the bottom-right corner where the video length sits. Then shrink it to phone size and check every word. The free guide has the full checklist."
    keywords: [youtube thumbnail text, thumbnail tips, faceless youtube, youtube thumbnails, youtube tips, small youtuber tips]
    link: guide/youtube-thumbnail-text-rules
    board: "Faceless YouTube Tips"

  - slug: youtube-chapter-rules
    type: tip
    topic: youtube
    kicker: "YouTube tip"
    headline: "The *3 chapter rules* YouTube checks"
    body: "First timestamp at 0:00, at least three chapters, and each chapter at least 10 seconds long."
    tag: "Save for later"
    title: "YouTube Chapter Rules: 0:00 Start, 3 Chapters, 10 Seconds Each"
    description: "Chapters only show up when they follow YouTube's rules: the first timestamp is 0:00, there are at least three chapters, and each one lasts at least 10 seconds. Give each chapter a plain title with one idea, and your chapter list doubles as a ready-made list of Shorts ideas. The free guide shows how to turn chapters into Shorts."
    keywords: [youtube chapters, youtube timestamps, youtube shorts, faceless youtube, youtube description, youtube tips]
    link: guide/chapters-to-youtube-shorts
    board: "Faceless YouTube Tips"

  - slug: script-prompt-points-first
    type: tip
    topic: workflow
    kicker: "AI script tip"
    headline: "Write *your points* before the prompt"
    body: "A topic alone gets a generic script. List the facts you've checked, in order, and tell the AI not to add new ones."
    tag: "Free guide"
    title: "AI Script Prompts That Sound Human: Start With Your Own Points"
    description: "Most robotic AI scripts come from thin prompts. Before you write any prompt wording, list your points: one short sentence of fact or instruction each, with one concrete example, checked before they go in. Add a voice description and a banned-phrase list, then edit the draft out loud. The free guide includes a full example prompt to copy."
    keywords: [ai script prompts, faceless youtube, youtube script, ai voiceover, ai video script, youtube automation]
    link: guide/ai-script-prompts-that-sound-human
    board: "Faceless YouTube Tips"

  - slug: one-video-buffer
    type: tip
    topic: workflow
    kicker: "Solo creator tip"
    headline: "Keep a *one-video buffer*, not a backlog"
    body: "One finished video scheduled a week ahead means a sick day moves your work, not your upload."
    tag: "Save for later"
    title: "Weekly Content Calendar Tip: Build a One-Video Buffer"
    description: "A buffer is one finished video scheduled ahead of its publish date. For two or three weeks, add one extra script early in the week, then schedule that video a week out and keep working one week ahead. If you use it, rebuild it slowly. The free guide has a sample weekly calendar for one-person channels."
    keywords: [content calendar, youtube schedule, faceless youtube, solo creator, youtube workflow, batching content]
    link: guide/content-calendar-one-person-channel
    board: "Faceless YouTube Tips"

  - slug: one-change-per-week
    type: tip
    topic: workflow
    kicker: "Weekly review tip"
    headline: "Change *one thing* each week"
    body: "Pick a single change, write it down and keep everything else the same, so you can see what it did."
    tag: "Free guide"
    title: "Weekly YouTube Review: Change One Thing at a Time"
    description: "Changing your title style, thumbnail and upload day all at once makes it impossible to tell what helped. In a short weekly review, note your numbers, compare them with your own last four to six videos and choose exactly one change for next week. If nothing stands out, keep going. The free guide walks through a 20-minute review."
    keywords: [youtube analytics, weekly review, content strategy, youtube studio, faceless youtube, pinterest analytics]
    link: guide/weekly-content-review
    board: "Faceless YouTube Tips"

  - slug: free-product-first
    type: tip
    topic: workflow
    kicker: "Selling tip"
    headline: "Offer a *free product* before a paid one"
    body: "A short, finished freebie lets viewers try your work and shows whether they want this kind of product at all."
    tag: "Free guide"
    title: "Selling Digital Products From a Faceless Channel: Start With a Freebie"
    description: "On Payhip you can offer a free product that collects an email before the download. Keep it small, useful and finished, like a one-page checklist, not a teaser with the useful part removed. It helps you learn what your viewers want before you build something bigger. The honest Payhip basics guide covers pricing, links and coupons too."
    keywords: [sell digital products, payhip, faceless youtube, lead magnet, digital downloads, creator business]
    link: guide/sell-digital-products-faceless-channel
    board: "Faceless YouTube Tips"

