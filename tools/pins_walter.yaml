- slug: lead-service-line-check
  week: 2026-10-19
  type: older
  topic: plumbing
  kicker: Older homes · Water line
  headline: Built before 1986? | Check for *lead pipe*
  body: Look where the water line comes in. Lead is dull gray, soft, shiny when scratched, and magnets don't stick.
  tag: Older homes
  title: Older Home? How to Check Your Water Service Line for Lead
  description: >-
    The EPA notes that homes built before 1986 are more likely to have lead pipes, solder or
    fittings. Find where the water line comes into the house, usually near the main shutoff.
    Lead pipe is dull gray and soft; a gentle scratch with a key shows shiny silver, and a
    magnet won't stick. Not sure? Ask your water utility, many keep a service line record, and
    a licensed plumber. More older home checks on Walter's free tool.
  keywords: [lead service line, lead pipes older homes, old house plumbing, water line check, older homes, homeowner tips]

- slug: grease-fire-lid-not-water
  week: 2026-10-19
  type: quick
  topic: kitchen
  kicker: Before the holiday cooking
  headline: Grease fire? | *Lid*, not water
  body: Slide a lid over the pan and turn off the burner. Never water. If it spreads, get out and call 911.
  tag: Safety check
  title: Grease Fire in a Pan? Put a Lid On It — Never Water
  description: >-
    NFPA notes Thanksgiving is the peak day for home cooking fires. Its advice for a grease fire in
    a pan: slide a lid over it, turn off the burner and leave the lid on until it cools. Never
    pour water on it and never carry the pan. For an oven fire, turn it off and keep the door
    closed. If the fire grows, get everyone out and call 911. Keep a lid next to the stove.
    More kitchen safety on Walter's page.
  keywords: [grease fire, kitchen fire safety, thanksgiving cooking safety, home fire prevention, holiday safety tips, homeowner tips]

- slug: frost-inside-windows-showing
