- slug: holiday-lights-check
  week: 2026-10-12
  type: quick
  topic: electrical
  kicker: Before you decorate
  headline: Check every *light string* first
  body: Frayed wires, cracked sockets or loose bulbs? Toss that string. Outside, use only lights made for outdoor use.
  tag: Safety check
  title: Check Holiday Light Strings Before You Hang Them
  description: >-
    Before the holiday lights go up, plug each string in on the floor and look it over:
    frayed or pinched wires, cracked or broken sockets, loose connections and bulbs that get
    very hot. Throw out damaged strings instead of taping them. Outside, use only lights and
    extension cords marked for outdoor use, and follow the maker's limit on how many strings
    connect end to end. More easy home safety checks on Walter's page.
