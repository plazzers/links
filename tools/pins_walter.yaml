  kicker: New guide · Ice dams
  headline: Big icicles? | Think *ice dam*
  body: Heat leaking into the attic melts snow that refreezes at the cold edge of the roof. Look from the ground, never climb.
  tag: Read the guide
  link: walter/guides/how-to-prevent-ice-dams
  title: How to Prevent Ice Dams — Causes, Warning Signs and Safe Fixes
  description: >-
    Thick icicles and a ridge of ice along the roof edge can mean an ice dam. Heat and warm air
    leaking into the attic melt the snow on the roof, and the water refreezes at the cold eaves,
    where it can back up under the shingles. Look from the ground, stay off icy roofs, and watch
    ceilings near outside walls for stains. Air sealing and insulation are the long-term fix.
    Read Walter's full guide to preventing ice dams.
  keywords: [how to prevent ice dams, ice dams, icicles on roof, winter home prep, attic insulation, roof leak in winter]

