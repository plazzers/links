  title: Rust or Water Stains on an Electrical Panel — A Buyer Red Flag
  description: >-
    At a showing, look at the electrical panel cover, usually in the basement, garage or a
    utility room. Rust, water stains, or drip marks on or above it can mean water has been
    getting in. That's worth a close look by a licensed electrician before you buy. Never open
    the panel yourself. Note it, and ask your home inspector and the seller about it. More
    buyer red flags on Walter's page.
