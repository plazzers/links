  kicker: Cold morning habit
  headline: "*Don't* warm the car | in the garage"
  body: Even with the door open, exhaust can build up and seep into the house. Back it out first.
  tag: Safety check
  title: Don't Warm Up Your Car in the Garage — Even With the Door Open
  description: >-
    On cold mornings it's tempting to start the car in the garage and let it warm up. The CPSC
    and fire safety groups warn against running a car in an attached garage, even with the big
    door open, because carbon monoxide can build up and get into the house. Back the car out
    first, then let it run outside. Make sure your CO alarms work. More winter safety on
    Walter's page.
