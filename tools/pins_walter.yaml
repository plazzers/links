- slug: lead-paint-before-1978
  type: older
  topic: paint
  kicker: Built before 1978?
  headline: Test for | *lead paint* | before you sand
  body: Paint from before 1978 may contain lead. Don't sand, scrape or heat-strip until it's been tested.
  tag: Older homes
  title: Lead Paint in Homes Built Before 1978 — Test Before You Sand
  description: >-
    Homes built before 1978 may have lead-based paint somewhere under the newer layers.
    Intact paint is usually left alone; the risk comes from dust and chips when it's sanded,
    scraped or heat-stripped. Test before a project, using a certified lead inspector or an
    EPA-recognized test kit, and use lead-safe work practices. See what else to check for
    your home's build year with Walter's free house-age tool.
  keywords: [lead paint, old house renovation, homes built before 1978, older home problems, home renovation safety, house built in]

- slug: asbestos-floor-tiles
  type: older
  topic: asbestos
  kicker: Built before the 1980s?
  headline: Old *9-inch floor tiles*
  body: Some older tiles and their black glue contain asbestos. Leave them alone, or test before removing.
  tag: Older homes
  title: Old 9x9 Floor Tiles — Why to Test Before You Remove Them
  description: >-
    Many older homes have 9-inch square vinyl floor tiles, often in basements and kitchens.
    Some tiles from that era, and the black adhesive under them, contain asbestos. Intact
    tiles are usually not a problem; breaking, sanding or scraping them is. Leave them in
    place or cover them, and have a sample tested before any removal. Check what else to
    look at for your home's age with Walter's free house-age tool.
  keywords: [asbestos floor tiles, 9x9 tiles, old house renovation, older home problems, basement remodel, house built in]

- slug: popcorn-ceiling
  type: older
  topic: asbestos
  kicker: Built before the 1980s?
  headline: Test that | *popcorn ceiling* | before you scrape
  body: Some textured ceilings from that era contain asbestos. Have a sample tested before you disturb it.
  tag: Older homes
  title: Removing a Popcorn Ceiling? Test It for Asbestos First
  description: >-
    Popcorn or cottage cheese ceilings were popular for decades, and some applied before the
    1980s contain asbestos. You can't tell by looking. Before you scrape, sand or drill it,
    have a sample tested by a lab. If it's positive, leave it alone or hire a licensed
    abatement pro. A sensible first step for older home renovations. See what to check for
    your build year with Walter's free house-age tool.
  keywords: [popcorn ceiling removal, asbestos testing, older home problems, old house renovation, ceiling remodel, house built in]

- slug: vermiculite-insulation
  type: older
  topic: asbestos
  kicker: Older attic?
  headline: Loose, pebbly *attic insulation*
  body: Gray-brown, shiny, pebble-like insulation may be vermiculite, which can contain asbestos. Don't disturb it.
  tag: Older homes
  title: Vermiculite Attic Insulation — What Older Home Owners Should Know
  description: >-
    Look in the attic of an older home. If the insulation is loose, pebbly and gray-brown or
    silvery-gold, it may be vermiculite, and some vermiculite contains asbestos. Don't
    disturb it, don't store things up there, and don't try to remove it yourself. Have it
    tested and get a pro's advice before any attic work. More era-by-era checks in Walter's
    free house-age tool.
  keywords: [vermiculite insulation, attic insulation, asbestos, older home problems, old house tips, house built in]

- slug: old-pipe-wrap
  type: older
  topic: asbestos
  kicker: Older basement?
  headline: White wrap on | *old heating pipes*
  body: Some old pipe and boiler insulation contains asbestos. If it's intact, leave it. Crumbling? Call a pro.
  tag: Older homes
  title: Old White Pipe Insulation in the Basement — Leave It Be
  description: >-
    In many older homes, heating pipes and boilers are wrapped in white or gray insulation
    that looks like plaster or corrugated paper. Some of it contains asbestos. If it's
    intact, it's usually best left alone. If it's damaged, crumbling or in the way of a
    project, have it tested and handled by a licensed pro. See what else to check for your
    home's age with Walter's free house-age tool.
  keywords: [asbestos pipe insulation, old boiler, basement pipes, older home problems, old house tips, house built in]

- slug: knob-and-tube-wiring
  type: older
  topic: wiring
  kicker: Built before the 1950s?
  headline: Look for *knob-and-tube* wiring
  body: Ceramic knobs and tubes in the attic or basement. It's ungrounded and often modified. Get it checked.
  tag: Older homes
  title: Knob-and-Tube Wiring — How to Spot It in an Older Home
  description: >-
    Knob-and-tube wiring was common in houses built roughly before the 1950s. Look in the
    attic and basement for single wires running on white ceramic knobs and through ceramic
    tubes. It has no ground wire, and decades of changes and buried insulation can make it a
    concern. Many insurers ask about it, so have an electrician evaluate it. Check what else
    to look at for your build year with Walter's free house-age tool.
  keywords: [knob and tube wiring, old house wiring, older home problems, electrical safety, buying an old house, house built in]

- slug: aluminum-wiring
  type: older
  topic: wiring
  kicker: Built 1965–1975?
  headline: Ask about *aluminum wiring*
  body: Homes from roughly the mid-60s to mid-70s may have it. Connections can loosen. An electrician can check.
  tag: Older homes
  title: Aluminum Wiring in 1960s and 1970s Homes — What to Know
  description: >-
    Some homes built roughly from the mid-1960s to the mid-1970s have aluminum branch wiring.
    The concern is the connections at outlets, switches and splices, which can loosen and
    overheat over time. Look for "AL" printed on wire jackets in the panel or basement, and
    have an electrician check it; there are proven repair methods. Find more checks for your
    home's age in Walter's free house-age tool.
  keywords: [aluminum wiring, 1970s house, older home problems, electrical safety, buying an old house, house built in]

- slug: polybutylene-pipes
  type: older
  topic: pipes
  kicker: Built late 1970s to mid-1990s?
  headline: Gray plastic pipes? Check for *polybutylene*
  body: Often stamped PB. It's known to fail without warning. Worth a plumber's opinion, especially if you're buying.
  tag: Older homes
  title: Polybutylene Pipes — How to Spot Them in Your Home
  description: >-
    Polybutylene water pipe was used in many homes built roughly from the late 1970s to the
    mid-1990s. It's usually gray (sometimes blue or black), flexible, and often stamped
    PB2110. It has a history of failing without much warning. Look near the water heater,
    under sinks and where the main line enters. Ask a plumber about it, especially when
    buying. More checks by build year in Walter's free house-age tool.
  keywords: [polybutylene pipes, 1980s house, plumbing problems, older home problems, buying a house, house built in]

- slug: galvanized-pipes
  type: older
  topic: pipes
  kicker: Built before the 1960s?
  headline: Old *galvanized* water pipes
  body: Gray steel pipes can rust from the inside. Low pressure or brown water at first turn-on are the clues.
  tag: Older homes
  title: Galvanized Water Pipes in Older Homes — Signs to Watch For
  description: >-
    Galvanized steel water pipes were common in homes built roughly before the 1960s. Over
    time they can rust and narrow from the inside. Clues: low water pressure, brownish water
    when a tap is first turned on, and rust at the joints. A magnet sticks to galvanized
    pipe but not to copper. A plumber can tell you how much life is left. See more checks
    for your home's age in Walter's free house-age tool.
  keywords: [galvanized pipes, old plumbing, low water pressure, older home problems, old house tips, house built in]

- slug: older-panel-brands
  type: older
  topic: panel
  kicker: Older electrical panel?
  headline: Know the *brand* of your panel
  body: Some older panels, like Federal Pacific Stab-Lok and Zinsco, have known concerns. Ask an electrician.
  tag: Older homes
  title: Federal Pacific and Zinsco Panels — Why to Check Your Panel's Brand
  description: >-
    The brand name is usually on the panel door or the label inside it. Some older panels,
    including Federal Pacific Electric (Stab-Lok breakers) and Zinsco, have known concerns,
    and some insurers ask about them. If yours is one of them, or just very old, have a
    licensed electrician take a look. Leave the cover on yourself. More checks for your
    home's build year in Walter's free house-age tool.
  keywords: [Federal Pacific panel, Zinsco panel, electrical panel, older home problems, electrical safety, house built in]

- slug: two-prong-outlets
  type: older
  topic: wiring
  kicker: Older home?
  headline: Two-prong outlets | *aren't grounded*
  body: A three-prong adapter doesn't fix it. GFCI protection or proper grounding by an electrician does.
  tag: Older homes
  title: Two-Prong Outlets in an Older Home — the Safe Way to Upgrade
  description: >-
    Two-prong outlets are common in older homes and mean the circuit likely has no ground
    wire. A cheap three-prong adapter doesn't change that, and swapping in a three-prong
    outlet without a ground just hides it. Safer options: have an electrician add GFCI
    protection (labeled properly) or run a ground. A plug-in tester shows what you have.
    More checks by build year in Walter's free house-age tool.
  keywords: [two prong outlets, ungrounded outlets, old house wiring, older home problems, electrical safety, house built in]

- slug: sewer-line-scope
  type: older
  topic: sewer
  kicker: Built before the 1970s?
  headline: Scope the *sewer line* before you buy
  body: Older clay and cast-iron lines can crack or fill with roots. A camera inspection shows what you can't see.
  tag: Older homes
  title: Why a Sewer Camera Inspection Is Worth It on an Older Home
  description: >-
    Many older homes have clay or cast-iron sewer lines running out to the street. Tree
    roots, cracks and sags happen out of sight, and a standard home inspection doesn't see
    inside the pipe. A sewer scope (camera inspection) by a plumber shows the line's
    condition before you buy. Slow drains and gurgling toilets are clues too. More checks
    for your home's age in Walter's free house-age tool.
  keywords: [sewer scope inspection, sewer line, older home problems, buying an old house, home inspection, house built in]

