- slug: humidifier-pad-before-winter
  week: 2026-10-12
  type: quick
  topic: hvac
  kicker: Have a furnace humidifier?
  headline: Change the *humidifier pad*
  body: A whole-house humidifier on the furnace has a pad that gets crusty with minerals. Most makers say once a season.
  tag: Winter tip
  board: Winter Home Prep
  title: Have a Furnace Humidifier? Change the Pad Before Winter
  description: >-
    Many furnaces have a whole-house humidifier mounted on the ductwork. Inside is a pad
    (water panel) that slowly fills with mineral crust, and once it's clogged it stops doing
    much. Most makers suggest replacing it once a heating season. Turn the humidifier off,
    open the cover, look at the pad and check your model's manual for the right part. More
    winter home prep on Walter's page.
  keywords: [furnace humidifier pad, whole house humidifier, winter home prep, furnace maintenance, dry winter air, homeowner tips]

- slug: water-heater-120-degrees
  week: 2026-10-12
  type: quick
  topic: plumbing
  kicker: One thing to do today
  headline: Check your *water heater* setting
  body: Many safety and energy guides suggest about 120°F. Hotter water can scald, especially kids and older adults.
  tag: 5-minute check
  title: What Temperature Should Your Water Heater Be Set To?
  description: >-
    Energy.gov and safety groups commonly suggest setting a home water heater to about 120°F.
    It's hot enough for most households, uses less energy than higher settings and lowers the
    risk of scalding, which matters most for young kids and older adults. Find the dial on
    the tank (or the display on tankless units) and read your manual before you change it.
    More five-minute checks on Walter's page.
  keywords: [water heater temperature, 120 degrees water heater, scald prevention, home safety tips, energy saving tips, homeowner tips]

- slug: fridge-door-seal-test
  week: 2026-10-12
  type: quick
  topic: kitchen
  kicker: Before the holiday cooking
  headline: Test the *fridge door seal*
  body: Close the door on a sheet of paper. If it slides out with no pull, the gasket may not be sealing there.
  tag: 5-minute check
  title: The Paper Test for Your Fridge Door Seal (Before the Holidays)
  description: >-
    The fridge works hardest during the holidays. Check the door gasket: close the door on a
    sheet of paper in a few spots around the edge and pull it out. You should feel some drag.
    If it slides out easily, clean the gasket with warm soapy water and try again. If it still
    doesn't seal, look up the replacement gasket for your model. More easy kitchen checks on
    Walter's page.
  keywords: [refrigerator door seal, fridge gasket test, kitchen maintenance, holiday cooking prep, appliance care, homeowner tips]

- slug: home-fire-escape-plan
  week: 2026-10-12
  type: quick
  topic: fire
  kicker: 10 minutes with the family
  headline: Two ways out of *every room*
  body: Walk the house together. Pick a meeting spot outside. Make sure windows open and nothing blocks the doors.
  tag: Safety check
  title: Make a Home Fire Escape Plan — Two Ways Out of Every Room
  description: >-
    NFPA recommends every home have a fire escape plan: know two ways out of every room,
    make sure doors and windows open easily, and pick a meeting spot outside, like a tree or
    the mailbox. Walk it with everyone who lives there, including guests who stay over the
    holidays, and practice it. Pair it with working smoke alarms on every level. More home
    safety checks on Walter's page.
  keywords: [home fire escape plan, fire safety, family safety plan, smoke alarms, home safety checklist, homeowner tips]

- slug: furnace-service-switch
  week: 2026-10-12
  type: quick
  topic: hvac
  kicker: Furnace won't start?
  headline: Check the *furnace switch* first
  body: Many furnaces have a switch nearby that looks like a light switch. It gets flipped off by accident more than you'd think.
  tag: Winter tip
  board: Winter Home Prep
  title: Furnace Not Turning On? Check This Switch Before You Call
  description: >-
    If the furnace won't come on, check the simple things before you call for service: the
    thermostat is set to heat and has batteries, the furnace filter isn't clogged, the breaker
    hasn't tripped, and the service switch near the furnace (it looks like a light switch) is
    on. If it still won't run, or you smell gas, call a heating pro or your gas company. More
    winter home prep on Walter's page.
  keywords: [furnace not turning on, furnace troubleshooting, furnace switch, winter home prep, heating problems, homeowner tips]

- slug: smoke-alarm-age
  week: 2026-10-12
  type: quick
  topic: alarms
  kicker: Turn it over and look
  headline: Smoke alarms *expire*
  body: Look for the date on the back. NFPA says replace smoke alarms every 10 years. CO alarms have a life too.
  tag: Safety check
  title: How Old Are Your Smoke Alarms? Check the Date on the Back
  description: >-
    Smoke alarms don't last forever. NFPA recommends replacing them 10 years from the date of
    manufacture, which is printed on the back. Carbon monoxide alarms also have a set life;
