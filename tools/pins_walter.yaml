  headline: Don't turn *the heat off*
  body: Set it no lower than about 55°F so the pipes stay safe. Ask a neighbor to check on the house.
  tag: Winter tip
  title: Traveling for the Holidays? Don't Turn Off the Heat
  description: >-
    Going away for the holidays in cold weather? Leave the heat on, set no lower than about
    55°F (the American Red Cross suggests this to help prevent frozen pipes). Know where the
    main water shutoff is, open cabinet doors under sinks on outside walls before a hard
    freeze, and ask a neighbor to check the house. Get Walter's free Before the First Freeze
    checklist on his page.
  keywords: [holiday travel home checklist, frozen pipes prevention, thermostat setting away, winter home prep, vacation home tips, homeowner tips]
  product: true

