  kicker: Listen in the basement
  headline: Sump pump running | in *dry weather*?
  body: A pump that keeps cycling when it hasn't rained can mean a high water table or a drainage issue. Ask.
  tag: Buyer red flag
  title: Sump Pump Running Nonstop at a Showing? Ask These Questions
  description: >-
    Stand in the basement for a minute at a showing and listen. A sump pump that runs again
    and again when it hasn't rained can point to a high water table, drainage problems or a
    pump issue. Ask the seller how often it runs, whether water has ever come in, if there's a
    backup and how old the pump is. Ask your home inspector to look too. More buyer red flags
    on Walter's page.
