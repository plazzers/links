  headline: Bedroom window | *painted shut*?
  body: Every bedroom needs a window that opens for escape. Old paint may contain lead, so don't sand or scrape. Ask a pro.
  tag: Older homes
  title: Windows Painted Shut in an Older Home? Why It Matters
  description: >-
    In older homes it's common to find windows painted shut. Fire safety groups say every
    bedroom should have two ways out, and a window that opens is often the second one. Try each
    bedroom window. If paint was applied before 1978, it may contain lead, so don't sand,
    scrape or force it; the EPA recommends lead-safe certified contractors for that work. More
