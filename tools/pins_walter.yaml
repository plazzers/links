    After snow or ice, gas companies often ask homeowners to keep the gas meter and the
    furnace and water heater vents clear. Brush snow off the meter gently by hand or with a
    broom, never kick it or chip ice with a shovel, and don't pile plowed snow on it. If you
    ever smell gas, get everyone out and call the gas company from outside. More winter home
    prep on Walter's page.
