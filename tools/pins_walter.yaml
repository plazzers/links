  kicker: Real Christmas tree?
  headline: Water the tree | *every day*
  body: A dry tree catches fire fast. Keep the stand full and the tree at least 3 feet from heaters, fireplaces and candles.
  tag: Safety check
  title: Christmas Tree Safety — Water It Daily and Keep It Away From Heat
  description: >-
    Fire safety groups like NFPA say a dried-out Christmas tree can burn very quickly. Cut a
    little off the trunk before you put it in the stand, check the water every day and keep it
    full, and set the tree at least 3 feet from fireplaces, space heaters, vents and candles.
    Turn off the tree lights at bedtime and when you leave, and take the tree down once it's
    dry. More holiday safety checks on Walter's page.
  keywords: [christmas tree safety, christmas tree water, holiday fire safety, real christmas tree tips, home fire prevention, holiday safety tips]

- slug: sellers-disclosure-read-it
  week: 2026-10-26
  type: buyer
  topic: paperwork
  kicker: Before you make an offer
  headline: Read the | *seller's disclosure*
  body: Ask for it early and read every line. "Unknown" on a lot of questions is worth a follow-up question.
  tag: Buyer red flag
  title: Read the Seller's Disclosure Before You Make an Offer
  description: >-
    In many states sellers fill out a disclosure form about the home's known problems: water,
    roof, repairs, permits and more. Ask for it early and read every line. Lots of "unknown"
    answers, past water or roof issues, or repairs without permits are worth asking about and
    pointing out to your home inspector. Rules vary by state, so ask your agent what applies.
    More buyer tips on Walter's page.
  keywords: [seller's disclosure, buying a house tips, first time home buyer, home inspection, buying a house red flags, house hunting tips]

- slug: attic-frost-check
  week: 2026-10-26
  type: quick
  topic: attic
  kicker: On a cold day, take a look
  headline: Frost *inside* | the attic?
  body: Shine a light on the underside of the roof and the nail tips. Frost there means warm, moist air is getting in.
  tag: Winter tip
  board: Winter Home Prep
  title: Frost in the Attic? What It Means and What to Check
  description: >-
    On a cold morning, look into the attic from the hatch with a flashlight. Frost on the
    underside of the roof boards or white tips on the nails usually means warm, moist air from
    the house is leaking into the attic. Check that bath and kitchen fans vent outside, not into
    the attic, and ask an energy or insulation pro about air sealing. Don't walk on the ceiling
    joists. More winter home prep on Walter's page.
  keywords: [frost in attic, attic moisture, attic ventilation, winter home prep, air sealing, homeowner tips]

- slug: clay-sewer-line-roots
  week: 2026-10-26
  type: older
  topic: sewer
  kicker: Older homes · Sewer line
  headline: Old *clay* | sewer pipe?
  body: Many older homes have clay sewer lines. Tree roots can get into the joints. A camera inspection shows it.
  tag: Older homes
  title: Clay Sewer Pipes in Older Homes — Why a Camera Inspection Helps
  description: >-
    Many older homes have a sewer line made of clay pipe sections. Over the years, tree roots
    can find their way into the joints, and pipes can crack or sag. Slow drains in the lowest
    part of the house or gurgling toilets can be early signs. Buying an older home? Ask about
    a sewer camera inspection by a plumber before you close. More older home checks on
    Walter's free house-age tool.
  keywords: [clay sewer pipe, sewer line inspection, older home plumbing, tree roots in sewer line, older homes, buying an older home]

- slug: run-every-faucet-at-showing
  week: 2026-10-26
  type: buyer
  topic: plumbing
  kicker: At a showing
  headline: Run *every* faucet | for a minute
  body: Watch the water pressure, how fast it drains, and look under the sink while it runs.
  tag: Buyer red flag
  title: Run Every Faucet at a House Showing — What to Watch For
  description: >-
    At a showing, turn on each faucet for a minute and flush the toilets. Watch for weak water
    pressure, slow or gurgling drains, rusty or cloudy water, and open the cabinet underneath
    to look for drips, stains or a soft floor. It's a quick, polite check, and anything odd is
    worth asking the seller about and pointing out to your home inspector. More buyer red flags
    on Walter's page.
  keywords: [house showing tips, plumbing problems, buying a house red flags, water pressure, home inspection, first time home buyer]

- slug: holiday-candles-12-inches
  week: 2026-10-26
  type: seasonal
  topic: candles
  kicker: Holiday candles
  headline: "Candles? Keep | *1 foot* clear"
  body: Curtains, decorations, the tree, paper. Blow them out when you leave the room or go to bed.
  tag: Safety check
  title: Holiday Candle Safety — Keep Them a Foot Away From Anything That Burns
  description: >-
    NFPA advises keeping candles at least 12 inches from anything that can burn, like curtains,
    holiday decorations, wrapping paper and the tree. Use sturdy holders on a flat surface, keep
    them out of reach of kids and pets, and blow them out when you leave the room or go to bed.
    Battery candles give the same glow without the flame. More holiday safety checks on
    Walter's page.
  keywords: [candle safety, holiday fire safety, christmas decorations safety, home fire prevention, holiday safety tips, homeowner tips]

- slug: sloping-floors-at-showing
  week: 2026-10-26
  type: buyer
  topic: structure
  kicker: Buyer red flag
  headline: Floors that | *slope*?
  body: Older houses settle a little. A floor you can feel tilt, with cracks or sticking doors nearby, needs a closer look.
  tag: Buyer red flag
  title: Sloping Floors at a Showing — When to Ask More Questions
  description: >-
    Walk each room slowly at a showing. A floor you can feel tilt or bounce, especially with
    diagonal wall cracks, doors that stick or gaps under baseboards nearby, is worth a closer
    look. Some settling is common in older houses, but your home inspector may suggest a
    structural engineer if the slope is noticeable. Ask the seller if anything was repaired.
    More buyer red flags on Walter's page.
  keywords: [sloping floors, uneven floors, foundation problems, buying a house red flags, house showing tips, home inspection]

- slug: range-anti-tip-bracket
  week: 2026-10-26
  type: quick
  topic: kitchen
  kicker: One thing to check today
  headline: Is your stove | *anchored*?
  body: A range can tip if a child stands on the open door. Check the manual or ask the installer. It's a small part.
  tag: Safety check
  title: Check Your Stove's Anti-Tip Bracket (Kitchen Safety for Families)
  description: >-
    The CPSC warns that freestanding ranges can tip forward if someone, often a child, climbs
    or stands on the open oven door. An anti-tip bracket holds the range in place. Check your
    range manual for how to tell if one is installed, or ask the installer to check. Many new
    ranges come with one in the box. A quick kitchen safety check before the holiday cooking.
    More safety checks on Walter's page.
  keywords: [stove anti tip bracket, kitchen safety, child safety at home, range tip over, home safety tips, homeowner tips]

- slug: new-carpet-only-in-basement
  week: 2026-10-26
  type: buyer
  topic: basement
  kicker: Buyer red flag
  headline: New carpet | *only* downstairs?
  body: It can be a simple update, or it can cover up past water. Look at the walls and ask.
  tag: Buyer red flag
  title: New Carpet Only in the Basement — What to Ask Before You Buy
  description: >-
    Brand-new carpet in a finished basement can be a nice update, or it can be covering up past
    water. Look at the bottom of the walls for stains, peeling paint or a white chalky powder,
    notice any musty smell, and look at the corners near the floor. Ask the seller directly if
    the basement has ever had water, and when the carpet went in. More buyer red flags on
    Walter's page.
  keywords: [wet basement, basement water damage, buying a house red flags, finished basement, house showing tips, home inspection]

- slug: dryer-vent-snow-outside
  week: 2026-10-26
  type: seasonal
  topic: dryer
  kicker: After a snowfall
  headline: Dryer vent | under *snow*?
  body: Find where the dryer vents outside. If snow piles up over it, the dryer can't breathe. Clear it gently.
  tag: Winter tip
  title: After a Snowstorm, Clear Snow From Your Dryer Vent Outside
  description: >-
    After a big snowfall, find where your dryer vents outside and make sure the flap isn't
    buried or iced shut. A blocked vent keeps hot, moist air and lint in the duct, and with a gas
    dryer, exhaust can back up into the house. Clear the snow gently by hand, check the other
    vents on that wall too, and make sure your CO alarms work. More winter home prep on Walter's
    page.
  keywords: [dryer vent snow, winter home maintenance, carbon monoxide safety, snow blocked vent, winter home prep, homeowner tips]

- slug: old-brass-gas-connector
  week: 2026-10-26
  type: older
  topic: gas
  kicker: Older homes · Gas appliances
  headline: Old *brass* gas | connector?
  body: Some older uncoated brass connectors behind stoves and dryers can fail. Don't move the appliance. Ask a pro.
  tag: Older homes
  title: Older Uncoated Brass Gas Connectors — Have a Pro Take a Look
  description: >-
    The CPSC has warned that some older uncoated brass flexible gas connectors, the tubes that
    link a gas stove, dryer or water heater to the gas line, can crack or come apart. If your
    home is older and the appliances have never been replaced, ask a qualified gas technician
    or plumber to check the connectors. Don't move or bend them yourself. If you smell gas, get
    out and call the gas company. More older home checks on Walter's free tool.
  keywords: [gas connector, brass gas connector, older home safety, gas appliance safety, older homes, homeowner tips]

- slug: anchor-tv-and-furniture
  week: 2026-10-26
  type: quick
  topic: tipover
  kicker: New TV for the holidays?
  headline: Anchor the *TV* | and the dresser
  body: TVs and furniture can tip onto small kids. Anti-tip straps and wall anchors are a small job.
  tag: Safety check
  title: Anchor Your TV and Furniture — A Simple Child Safety Check
  description: >-
    The CPSC warns that TVs, dressers and bookcases can tip over onto young children. If you're
    setting up a new TV for the holidays, mount it or anchor it with an anti-tip strap, and
    anchor dressers and bookcases to the wall. Keep remotes and toys off high furniture so kids
    aren't tempted to climb. A small home job with a big safety payoff. More safety checks on
    Walter's page.
  keywords: [anchor furniture, tv tip over, child safety at home, baby proofing, home safety tips, homeowner tips]

- slug: 5-checks-after-winter-storm
  week: 2026-10-26
  type: list
  topic: storm
  kicker: When the storm passes
  headline: 5 checks after | a *winter storm*
  items:
    - Vents outside clear of snow
    - Walk around, look up, stay off the roof
    - Big icicles at the gutters?
    - Ceilings near outside walls
    - Stay far from downed lines
  tag: Save this list
  board: Winter Home Prep
  title: 5 House Checks After a Winter Storm
  description: >-
    After a winter storm, walk around the house from the ground: clear snow from furnace, water
    heater and dryer vents, look up at the roof and gutters for heavy snow or big icicles, check
    ceilings and walls near outside walls for new stains, and keep well away from any downed
    power lines and call the utility. Stay off icy roofs. More winter home prep on Walter's
    page.
  keywords: [after winter storm checklist, winter storm home, ice dams, winter home maintenance, winter home prep, homeowner tips]

- slug: no-bathroom-fan-older-home
  week: 2026-10-26
  type: older
  topic: moisture
  kicker: Older homes · Bathrooms
  headline: No bathroom | *exhaust fan*?
  body: Many older bathrooms only have a window. In winter nobody opens it, and the moisture stays inside.
  tag: Older homes
  title: Older Home With No Bathroom Fan? Watch for Winter Moisture
  description: >-
    Many older homes were built with only a window in the bathroom, no exhaust fan. In winter
    nobody opens it, so shower steam stays in the room: look for peeling paint, black spots on
    the ceiling or a musty smell. Ask an electrician or contractor about adding a fan that vents
    outside, not into the attic. Older paint can contain lead, so don't sand it. More older home
    checks on Walter's free house-age tool.
  keywords: [bathroom exhaust fan, bathroom moisture, older home problems, mold prevention, older homes, winter home tips]

- slug: garage-door-bottom-seal
  week: 2026-10-26
  type: quick
  topic: garage
  kicker: One thing to check today
  headline: Check the | *garage door seal*
  body: Close the door and look along the bottom. Gaps let in cold, snow and critters. Bottom seals can be replaced.
  tag: 5-minute check
  title: Check Your Garage Door Bottom Seal Before Winter
  description: >-
    Close the garage door and look along the bottom from inside, ideally on a sunny day. If you
    see daylight, a cracked or flattened rubber seal, or gaps at the corners, cold air, snow,
    water and mice can get in. Many bottom seals can be replaced as a simple project; for the
    springs, cables and opener, call a garage door pro. More easy home checks on Walter's page.
  keywords: [garage door seal, garage door weatherstripping, winter home prep, drafty garage, home maintenance checklist, homeowner tips]

- slug: window-sweat-humidity
  week: 2026-10-26
  type: quick
  topic: windows
  kicker: New guide · Window condensation
  headline: Windows *sweating* | every morning?
  body: It's usually indoor humidity meeting cold glass. Run the bath and kitchen fans. Fog between panes is a failed seal.
  tag: Read the guide
  board: Winter Home Prep
  link: walter/guides/window-condensation-in-winter
  title: Condensation on Windows in Winter — What's Normal and What to Do
  description: >-
    Water or frost on the inside of your windows on cold mornings usually means humid indoor air
    is meeting cold glass. Run bath and kitchen fans, open the curtains during the day, and keep
    an eye on indoor humidity; the EPA suggests ideally 30 to 50 percent. Fog between the panes
    means a failed seal. Water on the sills or black spots are worth a closer look. Read
    Walter's full guide to window condensation.
  keywords: [condensation on windows in winter, window condensation, indoor humidity, winter home prep, foggy windows, homeowner tips]

- slug: garage-door-closed-in-cold
  week: 2026-10-26
  type: seasonal
  topic: garage
  kicker: Water lines in the garage?
  headline: Keep the garage | door *closed*
  body: In a deep freeze, pipes in or next to the garage are at risk. Keep the big door shut as much as you can.
  tag: Winter tip
  title: Pipes in the Garage? Keep the Garage Door Closed in a Freeze
  description: >-
    Many homes have water lines in the garage or in the wall between the garage and the house,
    and sometimes a water heater or laundry too. When it's very cold, keep the big garage door
    closed as much as you can so those pipes don't freeze. Look for pipes on outside walls and
    ask a plumber about insulating them. Keep the main water shutoff easy to reach. More winter
    home prep on Walter's page.
  keywords: [garage pipes freezing, prevent frozen pipes, winter home prep, cold garage, frozen pipes, homeowner tips]

- slug: furnace-filter-at-showing
  week: 2026-10-26
  type: buyer
  topic: hvac
  kicker: At a showing
  headline: Peek at the | *furnace filter*
  body: A clogged, gray filter can hint at how the system was cared for. Ask for service records and its age.
  tag: Buyer red flag
  title: Look at the Furnace Filter at a Showing — A Small Clue That Says a Lot
  description: >-
    At a showing, find the furnace or air handler and look at the filter if it's easy to see. A
    filter caked with dust can hint that regular maintenance was skipped. Ask the seller how old
    the furnace and AC are, when they were last serviced, and for any records. Your home
    inspector will look at the system, and you can ask about an HVAC check too. More buyer red
    flags on Walter's page.
  keywords: [furnace filter, hvac at showing, buying a house red flags, home inspection, house showing tips, first time home buyer]

- slug: 5-places-to-check-for-leaks
  week: 2026-10-26
  type: list
  topic: leaks
  kicker: Once a month this winter
  headline: 5 places to | check for *leaks*
  items:
    - Under sinks on outside walls
    - Around the water heater
    - Behind the washing machine
    - Attic, near the chimney and vents
    - Ceilings below bathrooms
  tag: Save this list
  title: 5 Places to Check for Hidden Leaks This Winter
  description: >-
    Once a month this winter, take a flashlight and check for drips, stains and damp spots
    under sinks on outside walls, around the water heater, behind the washing machine, in the
    attic near the chimney and vents, and on ceilings below bathrooms. Small leaks are easier
    to catch early. Find something wet? Turn off the water to it if you can and call a plumber.
    More easy home checks on Walter's page.
  keywords: [check for water leaks, hidden leaks, home maintenance checklist, winter home maintenance, water damage prevention, homeowner tips]

- slug: holiday-decor-at-showing
  week: 2026-10-26
  type: buyer
  topic: buying
  kicker: House hunting in December?
  headline: Look *behind* | the decor
  body: Big trees, rugs and decorations can block walls, floors and outlets. Ask to see what's behind them.
  tag: Buyer red flag
  title: Buying a House During the Holidays — Look Behind the Decorations
  description: >-
    A house dressed for the holidays looks great, and that's the point. But big trees, rugs,
    garlands and furniture moved for decorations can block walls, floors, outlets and windows.
    Politely ask to see behind them, look at ceilings and corners, and make sure your home
    inspector can reach everything. Ask for photos without the decor too. More buyer tips on
    Walter's page.
  keywords: [buying a house during the holidays, house showing tips, buying a house in winter, buying a house red flags, home inspection, first time home buyer]
