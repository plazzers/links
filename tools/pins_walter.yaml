  week: 2026-10-19
  type: quick
  topic: fire
  kicker: Frying a turkey this year?
  headline: Keep the fryer | *far from the house*
  body: Outside only, on flat ground, never in a garage or on a wooden deck. Thaw the turkey fully first.
  tag: Safety check
  title: Turkey Fryer Safety — Keep It Outside and Away From the House
  description: >-
    Frying a turkey for Thanksgiving? Fire safety groups like NFPA urge real caution with
    turkey fryers. If you use one, set it up outside on flat ground, well away from the house,
    never in a garage, on a porch or on a wooden deck. Thaw and dry the turkey completely,
    don't overfill the oil, keep kids and pets away and never leave it unattended. More
