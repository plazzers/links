  board: Winter Home Prep
  title: Daylight Under Your Exterior Door? Fix That Draft Before Winter
  description: >-
    On a sunny day, turn off the lights in the entry and look at the bottom of each exterior
    door. If you see daylight, cold air and water can get in. Many doors have an adjustable
    threshold, and a new door sweep is a simple job. Check the weatherstripping along the
    sides and top too: it should be soft and touch the door all the way around. More winter
    home prep on Walter's page.
