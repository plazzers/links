    date, and write a replacement reminder in your calendar. More home safety checks on
    Walter's page.
  keywords: [smoke alarm expiration, replace smoke detector, carbon monoxide alarm, fire safety, home safety checklist, homeowner tips]

- slug: water-pressure-at-showing
  week: 2026-10-12
  type: buyer
  topic: plumbing
  kicker: At the showing
  headline: Run the shower *and* the sink
  body: Weak flow with two taps open can point to old pipes or a supply problem. Ask your inspector about it.
