- slug: grease-not-down-the-drain
  week: 2026-10-12
  type: seasonal
  topic: plumbing
  kicker: Holiday cooking tip
  headline: Grease never goes *down the drain*
  body: It cools, sticks and builds up in the pipes. Let it cool in a can or jar, then throw it out.
  tag: Holiday tip
  board: Home Maintenance Checklists
  title: Don't Pour Turkey Grease Down the Drain (Do This Instead)
  description: >-
    Big holiday meals mean a lot of grease, and pouring it down the sink is a classic way to
    clog a kitchen drain. It cools and sticks inside the pipes and builds up over time. Let fat
    and grease cool in a can or jar, put a lid on it and throw it in the trash. Scrape plates
    into the trash before washing, and don't overload the garbage disposal. More holiday home
    tips on Walter's page.
  keywords: [grease down the drain, clogged kitchen sink, thanksgiving plumbing, holiday hosting tips, plumbing basics, homeowner tips]

- slug: stay-in-the-kitchen
  week: 2026-10-12
  type: seasonal
  topic: kitchen
  kicker: Holiday cooking safety
  headline: Frying or boiling? *Stay in the kitchen*
  body: Unattended cooking is a leading cause of home cooking fires. Keep a lid nearby for a pan fire.
  tag: Safety check
  board: Home Maintenance Checklists
  title: Holiday Cooking Fire Safety — Stay in the Kitchen
  description: >-
    NFPA reports that Thanksgiving is the peak day for home cooking fires, and unattended
    cooking is a leading cause. If you're frying, grilling or boiling, stay in the kitchen.
    Keep a lid or baking sheet nearby to smother a small pan fire, and never throw water on a
    grease fire. Keep kids at least three feet from the stove. More home safety tips on
    Walter's page.
  keywords: [thanksgiving cooking safety, kitchen fire safety, grease fire, holiday cooking tips, home safety checklist, fire prevention]

- slug: holiday-travel-thermostat
  week: 2026-10-12
  type: seasonal
  topic: travel
