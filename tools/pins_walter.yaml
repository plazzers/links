  week: 2026-10-19
  type: quick
  topic: drafts
  kicker: Look at the bottom of the door
  headline: See *daylight* under | your front door?
  body: Turn off the hall light and look. A gap means cold air in. A new door sweep or an adjusted threshold often fixes it.
