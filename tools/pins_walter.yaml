  kicker: New guide · Frozen pipes
  headline: Pipe froze? | *Never* use a flame
  body: Keep the faucet open and warm the pipe gently with a hair dryer or warm towels. Can't find the spot? Call a plumber.
  tag: Read the guide
  link: walter/guides/how-to-prevent-frozen-pipes
  title: How to Prevent Frozen Pipes (and Thaw One Safely)
  description: >-
    Faucet gives only a trickle on a freezing morning? A pipe may be frozen. Keep the faucet
    open, find the cold spot, and warm it gently with a hair dryer, a heating pad or towels
    soaked in hot water. Never use a torch, open flame or fuel-burning heater. If it bursts,
    shut off the main water valve and call a plumber. Read Walter's full guide on preventing
    frozen pipes this winter.
