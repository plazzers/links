  type: seasonal
  topic: hvac
  kicker: Before the cold sets in
  headline: New batteries | in the *thermostat*
  body: Many thermostats run on batteries. When they die, the heat may not come on. Swap them while it's still mild.
  tag: Winter tip
  title: Replace Your Thermostat Batteries Before Winter
  description: >-
    Many wall thermostats, even ones wired to the furnace, use AA or AAA batteries to run the
    display and settings. When the batteries die, the heat may stop following your settings,
    often on the coldest night. Look for a low-battery icon, pop the cover or check your
    manual, and replace them in the fall. Write the date inside the cover. More winter home
    prep on Walter's page.
  keywords: [thermostat batteries, furnace not turning on, winter home prep, heating system tips, fall home maintenance, homeowner tips]

- slug: rust-on-electrical-panel
