- slug: bleed-old-radiators
  week: 2026-10-12
  type: older
  topic: heating
  kicker: Older home with radiators?
  headline: Cold at the top? *Bleed* the radiator
  body: In hot water systems, trapped air keeps the top cold. A radiator key and a cup let it out. Steam systems differ.
  tag: Older homes
  title: Radiator Cold at the Top? How Bleeding Works in an Older Home
  description: >-
    Many older homes heat with hot water radiators. If a radiator is warm at the bottom but
    cold at the top, trapped air is a common cause. With the system cool, open the small
    bleed valve with a radiator key, hold a cup and a rag under it, and close it once water
    comes out. Steam radiators work differently, so check your system first or ask a heating
    pro. Pick your build year in Walter's free house-age tool.
  keywords: [bleed radiators, cold radiator, older home heating, hot water radiator, old house maintenance, winter home prep]

- slug: storm-windows-down
  week: 2026-10-12
  type: older
  topic: windows
  kicker: Older home?
  headline: Put the *storm windows* down
  body: Old single-pane windows often have storms. Close them for winter and check the weep holes at the bottom are clear.
