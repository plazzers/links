- slug: dry-brine-the-turkey
  week: 2026-10-12
  type: trick
  topic: holiday
  kicker: Holiday kitchen trick
  headline: Salt the Turkey | *a Day Ahead*
  body: Season it all over, leave it uncovered in the fridge overnight. The skin dries out and roasts crisper.
  quote: Restaurants season early because salt needs time. Your turkey does too.
  tag: Holiday trick
  board: Budget Family Dinners
  title: Dry Brine Your Turkey — Salt It a Day Ahead for Better Flavor
