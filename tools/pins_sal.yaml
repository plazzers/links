- slug: dont-rinse-pasta
  week: 2026-10-19
  type: trick
  topic: pasta
  kicker: Italian kitchen trick
  headline: "Don't *Rinse* | Your Pasta"
  body: That starch on the outside is what helps the sauce stick. Drain it, then straight into the pan.
  quote: Rinsing pasta washes the glue away. Then you wonder why the sauce slides off.
  tag: Italian trick
  board: Easy Italian Dinners
  title: Should You Rinse Pasta? Why Italian Cooks Don't
  description: >-
    Don't rinse cooked pasta for a hot dish. The thin layer of starch on the outside is what
    helps sauce cling, and rinsing washes it away and cools the pasta. Drain it, save a mug of
    the cooking water, and toss the pasta straight into the warm sauce with a splash of that
    water. The one exception: some cold pasta salads. Easy Italian dinner tips from Chef Sal
    Romano.
  keywords: [should you rinse pasta, how to cook pasta, pasta tips, easy italian dinners, italian cooking tips, pasta sauce]

