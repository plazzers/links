  kicker: Italian kitchen trick
  headline: Sour Sauce? | *Here's the Fix*
  body: Let it simmer longer, then add a pinch of sugar or a small piece of butter. Taste after each change.
  quote: Tomatoes change with the can and the season. Don't follow the recipe blind. Taste the sauce.
  tag: Italian trick
  board: Easy Italian Dinners
  title: How to Fix Sour or Acidic Tomato Sauce
  description: >-
    Tomato sauce tastes sharp or sour? Some canned tomatoes are more acidic than others. Let
    the sauce simmer a little longer, then add a small pinch of sugar or a knob of butter and
    taste again. A grated carrot cooked in at the start helps too. Go slowly: you want it
    rounded, not sweet. Easy Italian dinner tips from Chef Sal Romano. More on Sal's page.
  keywords: [sour tomato sauce fix, acidic pasta sauce, homemade marinara, easy italian dinners, cooking tips, italian cooking]

- slug: soft-meatballs-secret
  week: 2026-10-12
  type: trick
  topic: meatballs
  kicker: Italian kitchen trick
  headline: Soft Meatballs? | *Wet the Bread*
  body: Soak bread or breadcrumbs in milk first, then mix gently. Squeeze too hard and they turn into rocks.
  quote: The bread and milk are the secret. And a light hand. You're making meatballs, not baseballs.
  tag: Italian trick
  board: Easy Italian Dinners
  title: The Secret to Soft, Tender Meatballs (Bread and Milk)
  description: >-
    Why are restaurant meatballs so tender? A panade: bread or breadcrumbs soaked in milk and
    mixed into the meat. It keeps them moist and soft. Mix with your hands just until
    combined, roll them gently without packing, and simmer them in the sauce to finish. Easy
    Italian dinner tips from Chef Sal Romano. More Sunday dinner ideas on Sal's page.
  keywords: [soft meatballs, tender meatballs secret, italian meatballs, easy italian dinners, sunday dinner ideas, italian cooking tips]

- slug: bronze-cut-pasta
  week: 2026-10-12
  type: trick
  topic: grocery
  kicker: At the grocery store
  headline: Buy Pasta That | Says *Bronze-Cut*
  body: It has a rough, dull surface that grabs sauce. Smooth, shiny pasta lets the sauce slide off.
  quote: Run your finger over it. Rough and chalky is good. Shiny like plastic, the sauce won't stick.
  tag: Italian trick
  board: Easy Italian Dinners
