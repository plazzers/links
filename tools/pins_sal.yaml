- slug: warm-milk-mashed-potatoes
  week: 2026-10-12
  type: trick
  topic: potatoes
  kicker: Steakhouse side trick
  headline: Creamy Mash? | *Warm the Milk*
  body: Cold milk and butter cool the potatoes and turn them gluey. Warm them first, then mash gently.
  quote: Steakhouse mashed potatoes are two things. Warm dairy and a light hand. Never the blender.
  tag: Holiday trick
  board: Budget Family Dinners
  title: Steakhouse-Style Mashed Potatoes — Warm the Milk and Butter
  description: >-
    For creamy, steakhouse-style mashed potatoes, warm the milk and butter before they go in.
    Cold dairy cools the potatoes so you end up working them more, and overworked potatoes go
    gluey. Drain the potatoes well, let them steam dry for a minute, mash gently and season
    at the end. Never use a blender. Holiday side dish tips on Sal's page.
  keywords: [creamy mashed potatoes, steakhouse mashed potatoes, thanksgiving sides, holiday side dishes, cooking tips, budget family dinners]

- slug: cold-butter-pan-sauce
  week: 2026-10-12
  type: trick
  topic: butter
  kicker: Restaurant kitchen secret
  headline: "The Glossy Sauce | Trick: *Cold Butter*"
  body: When the pan sauce is done, take it off the heat and swirl in a small piece of cold butter.
  quote: That shine on a restaurant sauce? Butter at the very end. Off the heat, always.
