  title: Restaurant Pan Sauce Secret — Finish With Cold Butter
  description: >-
    Restaurant pan sauces look glossy and taste rich because of one last step: off the heat,
    swirl in a small piece of cold butter until it melts into the sauce. It thickens it a
    little and makes it smooth. Works after searing chicken, pork chops or steak, with a
    splash of broth or wine to lift the brown bits. More restaurant secrets on Sal's page.
  keywords: [pan sauce, restaurant cooking secrets, butter sauce, how to make a pan sauce, cooking tips, steak sauce]

- slug: reheat-pasta-in-a-pan
  week: 2026-10-12
  type: trick
  topic: leftovers
  kicker: Leftover trick
  headline: Reheat Pasta | in a *Pan*, Not | the Microwave
  body: A splash of water or sauce, a lid, low heat, a stir. It loosens up and tastes like day one.
