- slug: salt-the-pasta-water
  week: 2026-10-12
  type: trick
  topic: pasta
  kicker: Restaurant pasta secret
  headline: Salt the Water | *Before* the Pasta
  body: Wait for the boil, add a good handful of salt, taste the water. Pasta can only take in flavor while it cooks.
  quote: If the water tastes like nothing, the pasta tastes like nothing. Then the sauce has to work twice as hard.
  tag: Italian trick
  board: Easy Italian Dinners
  title: How Much Salt in Pasta Water? The Restaurant Rule
  description: >-
    Restaurant pasta tastes seasoned all the way through because the cooks salt the water.
    Bring a big pot to a rolling boil, add salt until the water tastes pleasantly salty, then
    add the pasta and stir. The pasta absorbs that seasoning as it cooks, so you need less
    salt in the sauce. Easy Italian kitchen tips from Chef Sal Romano. More on Sal's page.
  keywords: [salt pasta water, how to cook pasta, pasta tips, easy italian dinners, restaurant cooking secrets, italian cooking tips]

- slug: fix-sour-tomato-sauce
