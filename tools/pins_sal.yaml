    The easy restaurant-style trick for a better holiday turkey: a dry brine. Season the bird
    all over with salt (and pepper or herbs if you like) a day or two ahead and leave it in the
    fridge, uncovered, on a tray. The salt seasons the meat and the skin dries out so it
    roasts crisper. Follow the safe thawing and cooking times on the label. Holiday tips on
    Sal's page.
