  kicker: Italian kitchen trick
  headline: Never Throw Out | the *Parmesan Rind*
  body: Drop it into soup, beans or sauce while it simmers. Fish it out at the end. Big flavor, zero cost.
  quote: Italian grandmothers kept a bag of rinds in the freezer. It's flavor you already paid for.
  tag: Italian trick
  board: Easy Italian Dinners
  title: Save Your Parmesan Rinds — The Free Italian Soup Secret
