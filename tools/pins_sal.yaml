# ---------------------------------------------------------------- restaurant tricks (16)

- slug: menu-golden-corner
  type: trick
  topic: menu
  kicker: Restaurant secret
  headline: The Menu's | *Golden Corner*
  body: Your eyes land top-right first. That's where they put the dishes they most want you to order.
  quote: Read the whole menu, top to bottom. The best deal is almost never in the spotlight.
  tag: Restaurant trick
  title: The Menu "Golden Corner" Trick Restaurants Use
  description: >-
    Menu design tricks restaurants use: on many menus your eyes go to the top-right corner
    first, and that's where high-profit dishes often sit, sometimes in a box or with a
    photo. Read the whole menu before you decide. Chef Sal Romano shares what restaurants won't tell you. Get his free 25
    Rules for Eating Out on his page.
  keywords: [restaurant secrets, menu psychology, restaurant tricks, save money eating out, dining out tips, menu design]

- slug: menu-no-dollar-signs
  type: trick
  topic: menu
  kicker: Restaurant secret
  headline: Why Menus Hide | the *Dollar Sign*
  body: A plain "18" feels smaller than "$18.00". No sign, no cents, less pain when you order.
  quote: When the menu won't show you the dollar sign, add it yourself. In your head. Every time.
  tag: Restaurant trick
  title: Why Restaurant Menus Leave Off the Dollar Sign
  description: >-
    Ever notice menus with prices like "18" instead of "$18.00"? Leaving off the dollar
    sign and the cents is a common menu design trick: it makes prices feel less like money,
    so people tend to spend more freely. Chef Sal Romano shares restaurant secrets so you can eat out smarter. Grab his free 25 Rules for Eating Out on his page.
  keywords: [restaurant secrets, menu psychology, menu pricing, restaurant tricks, dining out tips, save money eating out]

- slug: menu-price-endings
  type: trick
  topic: menu
  kicker: Restaurant secret
  headline: What *.95* vs *.00* | Is Telling You
  body: Prices ending in .95 feel friendly and casual. Round numbers feel upscale. Both are chosen on purpose.
  quote: Nobody picks a price by accident. Every number on that menu had a meeting.
  tag: Restaurant trick
  title: Menu Price Endings — What .95 and .00 Are Telling You
  description: >-
    Menu prices are rarely random. Prices ending in .95 or .99 tend to feel like a value
    and a casual place, while round numbers like 24 feel premium. Restaurants choose the
    ending to set the mood. Once you see it, you'll read menus differently. More
    restaurant secrets from Chef Sal Romano. His free 25
    Rules for Eating Out is on his page.
  keywords: [menu pricing psychology, restaurant secrets, menu tricks, restaurant tricks, dining out tips, pricing psychology]

- slug: the-decoy-dish
  type: trick
  topic: pricing
  kicker: Restaurant secret
  headline: The *Decoy Dish*
  body: One very expensive item makes everything near it look reasonable. It's not really there to be ordered.
  quote: That giant seafood tower isn't for you. It's there so the steak next to it looks cheap.
  tag: Restaurant trick
  title: The Decoy Dish — the Expensive Menu Item You're Not Meant to Order
  description: >-
    Many menus have one very expensive "decoy" dish. Next to it, the second most
    expensive item suddenly looks reasonable, and that's often the one they want to sell.
    It's called price anchoring. Notice it and judge each dish on its own. Chef Sal Romano
    shares what restaurants won't tell you. Get his free
    25 Rules for Eating Out on his page.
  keywords: [price anchoring, decoy pricing, restaurant secrets, menu psychology, restaurant tricks, save money eating out]

- slug: drinks-markup
  type: trick
  topic: drinks
  kicker: Restaurant secret
  headline: The Real Money | Is in *the Drinks*
  body: A fountain soda costs them very little. Wine by the glass usually carries the biggest markup of all.
  quote: Order water with lemon. It's free, it's refreshing, and your bill just got a lot smaller.
  tag: Restaurant trick
  title: Why Restaurant Drinks Are the Biggest Markup on the Bill
  description: >-
    The biggest markups in many restaurants aren't on the food. Fountain sodas, iced tea
    and coffee cost very little to serve, and wine by the glass is often marked up the
    most. Water with lemon is the easiest way to cut a dinner bill for the whole family.
    Restaurant secrets from Chef Sal Romano. Free 25 Rules
    for Eating Out on his page.
  keywords: [restaurant drink markup, save money eating out, restaurant secrets, dining out tips, frugal living tips, restaurant tricks]

- slug: little-yeses-upsell
  type: trick
  topic: service
  kicker: Restaurant secret
  headline: The *Little Yeses*
  body: '"Make it a large?" "Add shrimp?" "Another round?" Each yes is small. Together they add up fast.'
  quote: Before you say yes, ask one question. "How much is that?" Nobody minds. I promise.
  tag: Restaurant trick
  title: The "Little Yeses" Upsell — How a Restaurant Bill Grows
  description: >-
    "Would you like to add shrimp?" "Make it a large?" "Another round?" Each little yes
    seems small, but together they can add a lot to the bill. Servers are often trained to
    ask. It's fine to say yes; just ask the price first. Chef Sal Romano shares what restaurants won't tell you. Get his free 25 Rules for
    Eating Out on his page.
  keywords: [restaurant upselling, save money eating out, restaurant secrets, dining out tips, restaurant tricks, budget tips]

- slug: todays-special
  type: trick
  topic: menu
  kicker: Restaurant secret
  headline: What *“Today’s* | *Special”* Means
  body: Sometimes it's the chef's best idea. Sometimes it's what needs using up. Often there's no price.
  quote: Ask two things. What's in it, and what does it cost. A good server is happy to tell you.
  tag: Restaurant trick
  title: What "Today's Special" Really Means at a Restaurant
  description: >-
    The daily special can be the best thing on the menu: the chef's newest idea or
    something in season. Sometimes it's a way to use up ingredients, and specials read out
    loud often come without a price. Ask what's in it and how much it costs before you
    order. More restaurant secrets from Chef Sal Romano.
    Free 25 Rules for Eating Out on his page.
  keywords: [restaurant secrets, daily specials, dining out tips, restaurant tricks, save money eating out, ordering tips]

- slug: market-price
  type: trick
  topic: pricing
  kicker: Restaurant secret
  headline: Don't Fear | *Market Price.* | Ask It.
  body: '"Market price" just means it changes. Ask the number before you order. It''s not rude.'
  quote: The only bad question is the one you don't ask, and then see on the bill.
  tag: Restaurant trick
  title: What "Market Price" Means — and Why You Should Always Ask
  description: >-
    "Market price" on a menu, usually for seafood like lobster or fish, just means the
    price changes with what the restaurant pays. It's completely normal to ask your server
    the price before you order, and it avoids a surprise on the bill. Restaurant tips from
    Chef Sal Romano. Get his free 25 Rules for
    Eating Out on his page.
  keywords: [market price, seafood restaurant tips, restaurant secrets, dining out tips, save money eating out, restaurant tricks]

- slug: salty-bread-basket
  type: trick
  topic: drinks
  kicker: Restaurant secret
  headline: Why the Free | *Bread* Is So Salty
  body: Salty snacks make you thirsty. Thirsty tables tend to order another round of drinks.
  quote: Enjoy the bread. Just notice when the second basket shows up right before the drink menu.
  tag: Restaurant trick
  title: Why the Free Bread and Chips Are So Salty
  description: >-
    Free bread, chips and salty snacks are a nice welcome, and salty food also makes you
    thirsty, which tends to mean more drinks ordered. Enjoy them, and keep an eye on how
    many extra drinks end up on the bill. Restaurant secrets from Chef Sal Romano. Grab his free 25 Rules for Eating Out on his page.
  keywords: [restaurant secrets, free bread basket, restaurant tricks, dining out tips, save money eating out, menu psychology]

- slug: music-and-lighting
  type: trick
  topic: room
  kicker: Restaurant secret
  headline: The *Music &* | *Lighting* Game
  body: Fast music keeps tables moving. Dim light and slow songs keep you lingering over dessert.
  quote: The room is part of the menu. Somebody chose that playlist for a reason.
  tag: Restaurant trick
  title: How Restaurant Music and Lighting Change What You Order
  description: >-
    Restaurants think about music and lighting as much as food. Faster, louder music tends
    to keep tables turning at busy places, while dim lighting and slower songs can keep you
    relaxed, lingering and more likely to order dessert or another glass. Fun restaurant
    psychology from Chef Sal Romano. Free 25 Rules for
    Eating Out on his page.
  keywords: [restaurant psychology, restaurant secrets, dining out tips, restaurant tricks, restaurant atmosphere, fun facts]

- slug: the-portion-game
  type: trick
  topic: pricing
  kicker: Restaurant secret
  headline: The *Portion* Game
  body: Big plates, big portions, big prices. Half goes home in a box, and you paid restaurant prices for leftovers.
  quote: Share an entrée and order one extra side. Same food on the table, a much friendlier bill.
  tag: Restaurant trick
  title: The Restaurant Portion Game (and How Sharing Saves Money)
  description: >-
    Restaurant portions are often big enough for two, so half ends up in a takeout box and
    you've paid restaurant prices for leftovers. Try sharing an entrée and adding a side or
    a salad. Same full table, smaller bill. Money-saving restaurant tips from Chef Sal Romano. Get his free 25 Rules for Eating Out
    on his page.
  keywords: [restaurant portions, save money eating out, sharing meals, restaurant secrets, budget tips, dining out tips]

- slug: dessert-from-a-box
  type: trick
  topic: dessert
  kicker: Restaurant secret
  headline: That Dessert | Might Come | *From a Box*
  body: Many restaurants buy desserts frozen and just plate them. Ask what's made in-house.
  quote: If the kitchen didn't make it, you can buy it, or better, make it yourself for a lot less.
  tag: Restaurant trick
  title: Restaurant Desserts — Many Come Frozen. Here's What to Ask.
  description: >-
    Not every restaurant dessert is made in that kitchen. Plenty of places buy desserts
    frozen from big suppliers and just thaw and plate them. Nothing wrong with that, but it's
    worth asking what's made in-house before paying restaurant prices. Restaurant secrets
    from Chef Sal Romano. His copycat dessert recipes and
    free 25 Rules for Eating Out are on his page.
  keywords: [restaurant secrets, restaurant desserts, dining out tips, restaurant tricks, homemade desserts, save money eating out]

- slug: birthday-dessert
  type: trick
  topic: dessert
  kicker: Restaurant secret
  headline: The *Birthday* | *Dessert* Isn't | Really Free
  body: It's a lovely gesture. It's also a reason for the table to order coffee and a second dessert.
  quote: Sing, smile, blow out the candle. Then skip the coffee round if you didn't want it.
  tag: Restaurant trick
  title: The Free Birthday Dessert — a Sweet Restaurant Trick
  description: >-
    The free birthday dessert is a sweet gesture, and it's also good business: the whole
    table often ends up ordering coffee, drinks or another dessert to go with it. Enjoy the
    celebration and just order what you actually want. Restaurant secrets from Chef Sal Romano. Get his free 25 Rules for Eating Out
    on his page.
  keywords: [restaurant secrets, birthday dinner tips, restaurant tricks, dining out tips, save money eating out, restaurant psychology]

- slug: can-i-start-you-off
  type: trick
  topic: service
  kicker: Restaurant secret
  headline: '“Can I Start | *You Off With…?*”'
  body: The first question comes while you're hungry and haven't looked at prices. Take a minute first.
  quote: '"Just water for now, thanks." Five words. Then read the menu like it''s your money. It is.'
  tag: Restaurant trick
  title: '"Can I Start You Off With…" — Why Restaurants Ask Right Away'
  description: >-
    "Can I start you off with drinks or an appetizer?" usually comes before you've even
    opened the menu, while you're hungry and haven't looked at prices. It's fine to say
    "just water for now" and take a minute. Simple dining out tips from Chef Sal Romano, sharing what restaurants won't tell you. Free 25 Rules
    for Eating Out on his page.
  keywords: [restaurant secrets, restaurant upselling, dining out tips, save money eating out, restaurant tricks, ordering tips]

- slug: fancy-menu-words
  type: trick
  topic: menu
  kicker: Restaurant secret
  headline: Fancy *Menu Words* | Cost Extra
  body: '"Hand-crafted." "Farm-fresh." "Slow-simmered." A longer, prettier name makes the same dish feel worth more.'
  quote: Read the ingredients, not the poetry. Chicken is chicken, even when it's "heritage."
  tag: Restaurant trick
  title: How Fancy Menu Words Make Dishes Feel Worth More
  description: >-
    "Hand-crafted," "farm-fresh," "slow-simmered," "Grandma's": descriptive menu words make
    the same dish sound special, and people are often happy to pay more for it. Read what's
    actually on the plate. Menu psychology and restaurant secrets from Chef Sal Romano. Get his free 25 Rules for Eating Out on his page.
  keywords: [menu psychology, menu descriptions, restaurant secrets, restaurant tricks, dining out tips, save money eating out]

- slug: what-sal-orders
  type: trick
  topic: service
  kicker: Restaurant secret
  headline: What *Sal Orders* | When He Eats Out
  body: Something hard to make at home, water with lemon, and he shares the appetizer or skips it.
  quote: Order the dish you can't make on a Tuesday. Make the chicken Parm at home, it's better.
  tag: Restaurant trick
  title: What a Chef Orders When Eating Out
  description: >-
    What does a chef order when eating out? Chef Sal
    Romano picks the dish that's hard to make at home, drinks water with lemon, and shares
    an appetizer or skips it. Everything easy to copy, like chicken Parmigiana or
    breadsticks, he makes at home for a fraction of the price. His free 25 Rules for Eating
    Out are on his page.
  keywords: [chef tips, what to order at restaurants, restaurant secrets, dining out tips, save money eating out, restaurant tricks]

