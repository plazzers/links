# Chef Sal Romano — Pinterest pins.
#
# Each pin becomes pins/sal/NNN-slug.jpg (NNN = its position in this list),
# one row in pins/pinterest-bulk-sal.csv and one card in pins/index.html.
# To add a pin: copy a block of the same type, change everything, keep the
# slug unique (lowercase-with-dashes), add it at the END, then run
# python3 tools/make_pins.py  and  python3 tools/check_pins.py.
#
# Never use real restaurant brand names: say "the Italian chain", "the
# steakhouse chains", "the burger joints" and so on. Recipes are "inspired by".
#
# type:      recipe | trick | money   (sets the default board and link;
#            money pins link to the Restaurant or Home? calculator)
# topic:     a short word; the scheduler keeps the same topic from running back to back
# kicker:    small red line above the headline
# headline:  big serif text; wrap the words to show in red in *stars*; a | forces
#            a line break. Put the line in "quotes" if it starts with a *star*.
# recipe:    dish = number in the calculator (sets "cost at home" from it),
#            or give cost yourself; time, ingredients, cost_label, sub, quote
# trick:     body (2–3 short lines) and quote ("Sal says" box)
# money:     calc = {d: [dish numbers], p: people, t: tip %, dr: drinks $ each}
#            uses the calculator's own prices, so the numbers always match it;
#            {out} {home} {keep} {year} in the headline/description are filled in.
#            Or rows: top_savings / breakdown for a list instead of the card.
# tag:       the red button bottom-left
# title / description / keywords: what Pinterest shows (title <= 100 chars,
#            description <= 500, 5–8 keywords)

pins:

