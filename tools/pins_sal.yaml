- slug: olive-oil-harvest-date
  week: 2026-10-19
  type: trick
  topic: oil
  kicker: At the grocery store
  headline: "Olive Oil? | *Check the Date*"
  body: Fresher oil tastes better. Look for a harvest date and a dark bottle or tin, and keep it away from the stove.
  quote: Olive oil is fruit juice. Buy it fresh, keep it in the dark, and use it.
  tag: Italian trick
  board: Easy Italian Dinners
  title: How to Buy Better Olive Oil — Check the Harvest Date
  description: >-
    Olive oil tastes best fresh. At the store, look for a harvest date (not just a best-by
    date), a dark glass bottle or tin that blocks light, and "extra virgin" for drizzling and
    finishing. At home, store it in a cool, dark cupboard, not next to the stove, and use it
    within a few months of opening. Grocery tips from Chef Sal Romano. More easy Italian dinners
    on Sal's page.
  keywords: [how to buy olive oil, extra virgin olive oil, olive oil harvest date, italian grocery tips, easy italian dinners, italian cooking tips]

- slug: crowded-sheet-pan
  week: 2026-10-19
  type: trick
  topic: roasting
  kicker: Holiday sides trick
  headline: "Crispy Veggies? | *Give Them Room*"
  body: Packed tight, vegetables steam and go soft. Spread them out, use two pans, and get the oven hot first.
  quote: Give every piece of vegetable a little room. Roasting needs air. Steaming needs a crowd.
  tag: Holiday trick
  board: Budget Family Dinners
  title: How to Roast Vegetables So They Get Crispy, Not Soggy
  description: >-
    Restaurant roasted vegetables are browned and crispy because they aren't crowded. Spread
    them in a single layer with space between pieces, use two sheet pans if you need to,
    preheat the oven, toss with enough oil and salt, and don't stir too often. Perfect for
    Thanksgiving sides like Brussels sprouts, carrots, squash and potatoes. Holiday cooking
    tips on Chef Sal Romano's page.
  keywords: [how to roast vegetables, crispy roasted vegetables, thanksgiving side dishes, sheet pan dinner, holiday sides, cooking tips]

- slug: shared-plate-charge
  week: 2026-10-19
  type: trick
  topic: sharing
  kicker: Restaurant trick
  headline: "Sharing a Plate? | *Ask First*"
  body: Some restaurants add a charge for sharing an entree. Ask first. Often it still beats two big plates.
  quote: Big portions are made for sharing. Just ask how they handle it before you order.
  tag: Restaurant trick
  title: Sharing an Entree at a Restaurant — Ask About the Split Fee
  description: >-
    Restaurant portions are often big enough for two. Sharing an entree is a smart way to eat
    out for less, but some places add a split-plate charge or an extra side fee. Ask your
    server how they handle it before you order. Even with a small fee, one big plate plus a
    starter is often cheaper than two entrees. More ways to eat out for less from Chef Sal
    Romano.
  keywords: [split plate fee, sharing food at restaurants, save money eating out, restaurant secrets, restaurant tips, eat out cheaper]

- slug: holiday-leftovers-plan
  week: 2026-10-19
  type: trick
  topic: leftovers
  kicker: After the big dinner
  headline: "Leftovers? | *2-Hour Rule*"
  body: Food safety guidance says refrigerate within 2 hours, then eat in 3 to 4 days or freeze in portions.
  quote: The best part of a holiday dinner is the second day. Pack it up before you sit on the couch.
  tag: Holiday trick
  board: Budget Family Dinners
  title: Holiday Leftovers — The 2-Hour Rule and How Long They Keep
  description: >-
    After Thanksgiving dinner, pack up the leftovers before the pie. USDA food safety guidance
    says to refrigerate cooked food within 2 hours, use it within 3 to 4 days, or freeze it. Cut
    the turkey off the bone, use shallow containers so it cools fast, label the date, and
    freeze some in portions for easy dinners later. Budget family dinner tips from Chef Sal
    Romano.
  keywords: [thanksgiving leftovers, how long do leftovers last, leftover turkey, food safety tips, budget family dinners, holiday cooking tips]

- slug: room-temp-baking
  week: 2026-10-19
  type: trick
  topic: baking
  kicker: Holiday baking trick
  headline: "Bake Better: | *Soft Butter*"
  body: Room-temperature butter and eggs mix smoothly and trap air. Cold ones make dense cakes and lumpy batter.
  quote: Baking is patience first. Put the butter on the counter, pour a coffee, then start.
  tag: Holiday trick
  board: Budget Family Dinners
  title: Why Baking Recipes Say Room-Temperature Butter and Eggs
  description: >-
    Most cake and cookie recipes call for room-temperature butter and eggs for a reason. Soft
    butter creams with sugar and traps tiny air bubbles that help baked goods rise, and
    room-temperature eggs blend in smoothly instead of curdling the batter. Take them out ahead
    of time, or set whole eggs in warm water for a few minutes. Holiday baking tips from Chef
    Sal Romano.
  keywords: [room temperature butter, holiday baking tips, baking tips, christmas cookies, cake baking tips, cooking tips]

- slug: garlic-bread-broiler
  week: 2026-10-19
  type: trick
  topic: garlicbread
  kicker: Italian kitchen trick
  headline: "Garlic Bread? | *Watch It*"
  body: Soft butter, fresh garlic, a little parm, then under the broiler. It goes from golden to burnt in seconds.
  quote: Garlic bread under the broiler is not the time to check your phone. Stand there. Watch it.
  tag: Italian trick
  board: Easy Italian Dinners
  title: Restaurant-Style Garlic Bread — The Broiler Trick
  description: >-
    For restaurant-style garlic bread, mix soft butter with fresh minced garlic, a little
    grated parmesan and parsley, spread it on split Italian bread and bake until warm, then
    finish under the broiler until golden. Stay right by the oven: under the broiler it goes
    from golden to burnt in seconds. Perfect with Sunday sauce and pasta night. Easy Italian
    dinner tips from Chef Sal Romano.
  keywords: [garlic bread, restaurant garlic bread, easy italian dinners, pasta night, italian side dishes, garlic butter bread]
