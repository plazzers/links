  keywords: [canned whole tomatoes, best tomatoes for sauce, homemade marinara, easy italian dinners, italian cooking tips, pasta sauce]

- slug: still-or-sparkling
  week: 2026-10-19
  type: trick
  topic: water
  kicker: Restaurant trick
  headline: "Bottled Water? | *Tap Is Fine*"
  body: That question can mean bottled water on the bill. If you want tap water, just say so. It's normal.
  quote: Say "tap is great, thanks" with a smile. Nobody minds, and your bill stays the same.
  tag: Restaurant trick
  title: '"Still or Sparkling?" — The Restaurant Water Question'
  description: >-
    At some restaurants, the first question is "still or sparkling?" Answer either one and you
    may get a bottle of water that shows up on the bill. If you'd like regular tap water, it's
    perfectly normal to say "tap water is fine, thanks." If you want bottled, ask the price.
    Small habits like this keep a dinner out from creeping up. More restaurant secrets from
    Chef Sal Romano.
  keywords: [restaurant water, bottled water restaurant, restaurant secrets, save money eating out, restaurant tips, dining out tips]

- slug: stale-bread-italian-way
  week: 2026-10-19
  type: trick
  topic: bread
  kicker: Italian kitchen trick
  headline: "Stale Bread? | *Don't Toss It*"
  body: Italian kitchens turn it into breadcrumbs, croutons, panzanella or thick bean soup. Nothing wasted.
  quote: Yesterday's bread is tomorrow's dinner. That's how Italian families cooked for generations.
  tag: Italian trick
  board: Budget Family Dinners
  title: What to Do With Stale Bread — The Italian Way
  description: >-
    Italian home cooking wastes nothing, and stale bread is an ingredient. Blitz it into
    breadcrumbs for meatballs and toppings, toast cubes in olive oil for croutons, toss it with
    tomatoes and onion for panzanella, or simmer it into a thick Tuscan-style bean soup. Freeze
    leftover bread in a bag until you need it. Budget family dinner tips from Chef Sal Romano.
  keywords: [stale bread recipes, what to do with stale bread, italian cooking tips, zero waste cooking, budget family dinners, homemade breadcrumbs]

