  description: >-
    Better pasta isn't about the fanciest brand. Look for "bronze-cut" or "bronze die" on the
    bag: it means the pasta was pushed through bronze dies, which leaves a rough, dull surface
    that holds on to sauce. Durum wheat semolina should be the main ingredient. Smooth, shiny
    pasta lets the sauce slide off. Grocery tips from Chef Sal Romano. More on Sal's page.
  keywords: [bronze cut pasta, best pasta to buy, pasta grocery tips, easy italian dinners, italian cooking tips, how to buy pasta]

